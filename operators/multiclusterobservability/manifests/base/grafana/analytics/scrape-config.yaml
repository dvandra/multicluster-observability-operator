apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    app.kubernetes.io/component: platform-metrics-collector
    app.kubernetes.io/part-of: multicluster-observability-addon
    app.kubernetes.io/managed-by: multicluster-observability-operator
  name: platform-metrics-right-sizing
  namespace: open-cluster-management-observability
spec:
  jobName: right-sizing
  metricsPath: /federate
  params:
    match[]:
    - '{__name__="acm_rs:namespace:cpu_request_hard"}'
    - '{__name__="acm_rs:namespace:cpu_request"}'
    - '{__name__="acm_rs:namespace:cpu_usage"}'
    - '{__name__="acm_rs:namespace:cpu_recommendation"}'
    - '{__name__="acm_rs:namespace:memory_request_hard"}'
    - '{__name__="acm_rs:namespace:memory_request"}'
    - '{__name__="acm_rs:namespace:memory_usage"}'
    - '{__name__="acm_rs:namespace:memory_recommendation"}'
    - '{__name__="acm_rs:cluster:cpu_request"}'
    - '{__name__="acm_rs:cluster:cpu_usage"}'
    - '{__name__="acm_rs:cluster:cpu_recommendation"}'
    - '{__name__="acm_rs:cluster:memory_request"}'
    - '{__name__="acm_rs:cluster:memory_usage"}'
    - '{__name__="acm_rs:cluster:memory_recommendation"}'
    - '{__name__="acm_rs_vm:namespace:cpu_request"}'
    - '{__name__="acm_rs_vm:namespace:cpu_usage"}'
    - '{__name__="acm_rs_vm:namespace:cpu_recommendation"}'
    - '{__name__="acm_rs_vm:namespace:memory_request"}'
    - '{__name__="acm_rs_vm:namespace:memory_usage"}'
    - '{__name__="acm_rs_vm:namespace:memory_recommendation"}'
    - '{__name__="acm_rs:prediction_forecast_cpu"}'
    - '{__name__="acm_rs:prediction_forecast_memory"}'
    - '{__name__="acm_rs:prediction_forecast_workload_cpu"}'
    - '{__name__="acm_rs:prediction_forecast_workload_memory"}'
    - '{__name__="acm_rs:prediction_forecast_gpu_utilization"}'
    - '{__name__="acm_rs:prediction_forecast_gpu_memory"}'
    - '{__name__="acm_rs:prediction_forecast_vm_cpu"}'
    - '{__name__="acm_rs:prediction_forecast_vm_memory"}'
    - '{__name__="acm_rs:prediction_anomaly_score"}'
    - '{__name__="acm_rs:prediction_anomaly_score_workload"}'
    - '{__name__="acm_rs:prediction_anomaly_score_gpu"}'
    - '{__name__="acm_rs:prediction_anomaly_score_vm"}'
    - '{__name__="acm_rs:prediction_model_accuracy"}'
    - '{__name__="acm_rs:prediction_ensemble_weight"}'
    - '{__name__="kubevirt_vm_running_status_last_transition_timestamp_seconds"}'
  metricRelabelings:
  - action: labeldrop
    regex: managed_cluster|id
